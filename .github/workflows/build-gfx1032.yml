
name: Build Strata for RX 6650 XT (gfx1032)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout gfx1032 PR
        uses: actions/checkout@v4
        with:
          repository: yangweijie/Strata
          ref: pr-gfx1032
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify build tools
        shell: pwsh
        run: |
          python --version
          git --version
          cmake --version
          ninja --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Visual Studio Build Tools not found"
          }
          & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Build gfx1032 HIP Engine
        shell: cmd
        run: |
          set STRATA_HIP_ARCHS=gfx1032
          tools\hip\build_windows.bat

      - name: Upload Engine ZIP
        uses: actions/upload-artifact@v4
        with:
          name: strata-windows-x64-hip-gfx1032
          path: dist/strata-windows-x64-hip.zip
          if-no-files-found: error
          retention-days: 30
